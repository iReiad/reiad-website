# The live smoke test.
#
# `scripts/check-live.ts` asks the deployed site the handful of
# questions that cannot be answered from a file: whether the NEXT
# service binding is in effect, whether the second Worker's own
# JavaScript is being served, and whether the pieces that fall
# through to the asset router still do. It needs no secret: every
# URL it asks for is one a reader can ask for.
#
# On every push, because the questions are about the deployed site
# rather than about the commit. A failure here does not mean the
# push broke something; it means the site is not doing what the
# repository says.
#
# MAIN IS EXCLUDED, because there this races the deploy and loses:
# it has no upload to wait for, so it answers in seconds about a
# site the deploy is still replacing. deploy.yml runs the same
# script after its upload, which is the only moment the answer is
# about what was just deployed.

name: Live site check

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # It asks a couple of dozen URLs and each has its own deadline,
    # so this is generous. It is here because a job with neither sat
    # on a runner for six minutes waiting on a request nothing was
    # going to answer.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ask the live site
        run: node scripts/check-live.ts
