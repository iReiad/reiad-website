# Import the four curricula into D1, from a browser.
#
#   GitHub -> Actions -> "Import the schools into D1" -> Run workflow
#
# The alternative is two commands in a terminal, which has failed
# here for reasons that had nothing to do with the SQL: the wrong
# folder, an empty file left behind by a shell redirect, and a
# wrangler that imported that empty file and called it a success.
# Nobody types anything here.
#
# IT NEEDS the repository secret CLOUDFLARE_API_TOKEN, with
# Account -> D1 -> Edit and this account as its only resource.
# Without it this stops before it touches anything and says why.
#
# A token scoped that narrowly cannot list the account it belongs
# to, and wrangler asks for that list first ("Failed to
# automatically retrieve account IDs"). `account_id` in
# wrangler.toml is the answer; widening the token is not.
#
# IT DOES NOT RUN ON A PUSH OR A SCHEDULE. Filling this table
# replaces every row in it, and a job that can do that must never
# be able to start on its own.

name: Import the schools into D1

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which database"
        required: true
        default: remote
        type: choice
        options: [remote, local]

permissions:
  contents: read

concurrency:
  group: import-schools
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check the token is there
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. See the note at the"
            echo "::error::top of .github/workflows/import-schools.yml for how"
            echo "::error::to make one. Nothing was changed."
            exit 1
          fi

      - name: Build the SQL
        run: node scripts/import-schools.ts --out schools.sql

      # The failure this whole file exists for: an empty file that
      # imports perfectly and writes nothing. 314 statements is what
      # the generator prints; under 200 means it did not do its job
      # and wrangler must not be handed the result.
      - name: Refuse to import an empty file
        run: |
          queries=$(grep -c '^\(INSERT\|DELETE\)' schools.sql || true)
          size=$(wc -c < schools.sql)
          echo "schools.sql: $size bytes, $queries queries"
          if [ "$queries" -lt 200 ]; then
            echo "::error::Only $queries queries in the file. Expected around 314."
            echo "::error::Nothing was imported."
            exit 1
          fi

      - name: Import
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4 d1 execute reiad \
            --${{ inputs.target }} --file=schools.sql --yes

      # A tick on a job that wrote nothing is what wasted two
      # attempts, so the last thing it does is ask the database what
      # is in it.
      - name: Say what is in there now
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4 d1 execute reiad --${{ inputs.target }} --json \
            --command "SELECT
                 (SELECT COUNT(*) FROM school_stages)   AS stages,
                 (SELECT COUNT(*) FROM school_sections) AS sections,
                 (SELECT COUNT(*) FROM school_lessons)  AS lessons,
                 (SELECT COUNT(*) FROM school_lessons WHERE body <> '') AS written"
