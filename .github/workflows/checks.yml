# The checks, on a pull request rather than after it.
#
# `workflow_call` is why deploy.yml keeps no copy of the list
# below: it calls this, waits for it, and uploads only if it
# passed. Two copies of a list of checks is the same bug the
# checks are for.

name: checks

on:
  # `push` is the trigger this leans on: `pull_request` has stopped
  # firing this workflow before, for opens and pushes alike, while
  # `push` kept working, leaving pull requests with three green
  # checks and no `checks` run. main is excluded because deploy.yml
  # calls this workflow before it uploads.
  push:
    branches-ignore: [main]
  # Kept as well, so the run attaches to the pull request itself
  # whenever GitHub does deliver the event.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # The root package.json is not a dependency of the site:
      # nothing in it is shipped. It is here for the three
      # `--check` steps, which shell out to tsc and to the Tailwind
      # CLI, and for linkedom.
      #
      # Leaving this out does not fail loudly: `build-modules.ts`
      # runs `npx tsc`, and with no node_modules npx goes to the
      # registry, where `tsc` is not TypeScript.
      - name: Install the build tools
        run: npm ci

      # THE LIST IS scripts/check-all.ts, AND IT IS THE ONLY ONE.
      # `--stage` is what keeps this three steps: the headings stay
      # separate here and the list stays in one place there, so a
      # check added to check-all.ts runs here by itself.
      - name: Run the checks
        run: node scripts/check-all.ts --stage=checks

      # Generated files are committed here, so a build is not run:
      # what matters is that what was committed still matches its
      # source. The course catalogue's source is a Drive folder
      # nothing in CI can reach, and the committed crawl in
      # scripts/fixtures/ is what makes it reproducible here.
      - name: Check the generated files match their sources
        run: node scripts/check-all.ts --stage=generated

      # The tests that need no network, browser, database or
      # server.
      #
      # THE BROWSER TESTS ARE DELIBERATELY ABSENT. Every one of
      # them SKIPS rather than fails without a browser, a server on
      # :8899 or an OpenNext build, and exits 0, so adding them
      # here would turn a green tick into a statement about
      # nothing. CLAUDE.md says which ones and what each needs.
      - name: Run the tests
        run: node scripts/check-all.ts --stage=tests
