# The deploy: a push to main uploads worker.js and aab/ to the
# `reiad-website` Worker.
#
# It is here rather than in the Cloudflare dashboard because a
# Worker that fails to deploy is a Worker still answering every
# request with its last good version: the site stays up, the live
# check stays green, and the failure is written down only in a
# build log nobody has open. A workflow leaves a red tick on the
# commit that broke it. Dashboard build settings are also invisible
# from a clone; this file can be read.
#
# WHAT IT NEEDS: the repository secret CLOUDFLARE_API_TOKEN, with
#
#   Account -> Workers Scripts -> Edit      (this file)
#   Account -> D1 -> Edit                   (import-schools.yml)
#   Account Resources: this account, and nothing else
#
# The D1 and R2 bindings need no permission of their own: they are
# declared in wrangler.toml by id and by name and the upload
# attaches them.
#
# A token scoped that narrowly cannot list the account it belongs
# to, and wrangler asks for that list first ("Failed to
# automatically retrieve account IDs"). `account_id` in
# wrangler.toml is the answer; widening the token is not.
#
# ONE DASHBOARD STEP, ONCE: Workers Builds must be disconnected
# from this Worker (Workers & Pages -> reiad-website -> Settings ->
# Build), or both deploy on every push and the later one wins at
# random. `reiad-next` keeps its own Workers Build: it has a real
# build step and it needs the branch previews check-preview.ts
# reads.

name: Deploy

on:
  push:
    branches: [main]
  # So a deploy can be re-run without an empty commit, which is the
  # thing anybody wants at the moment a deploy has gone wrong.
  workflow_dispatch:

# It reads the repository and talks to Cloudflare. It writes
# nothing back to git.
permissions:
  contents: read

# Two pushes in a minute must not upload out of order and leave the
# older one live. Not cancel-in-progress: an upload that has begun
# is left to finish rather than killed halfway.
concurrency:
  group: deploy-reiad-website
  cancel-in-progress: false

jobs:
  # The same checks a pull request runs, called rather than copied.
  # checks.yml is the one list; this waits for it and the upload
  # below happens only if it passed.
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No `npm ci` here, deliberately: the builds that need it are
      # checks.yml's and that job installs its own. What is left
      # here needs nothing from node_modules.

      # Said before anything runs, because the failure it prevents is
      # a job that gets all the way to the upload and then dies on
      # an authentication error that reads like a Cloudflare
      # outage.
      - name: Check the token is there
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. See the note at the"
            echo "::error::top of this file for which permissions it needs."
            exit 1
          fi

      # Everything the real deploy validates, uploading nothing. It
      # is a second or two, and it turns a failed deploy into a
      # failed step with the same error message in it.
      - name: Dry run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy --dry-run

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy

      # live-check.yml races this job on a push to main: it can read
      # the site before the upload has landed and report on the
      # previous version. This run is the one whose answer is about
      # what was just deployed.
      - name: Ask the live site
        run: node scripts/check-live.ts
