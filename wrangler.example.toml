# ============================================================
# wrangler.example.toml — config for LOCAL DEVELOPMENT ONLY.
#
# WHY THIS ISN'T CALLED wrangler.toml
#
# A wrangler.toml in the repo root changes how Cloudflare builds a
# Pages project: it switches to running a "deploy command", and the
# one it picks by default is `npx wrangler deploy` — the Workers
# command, not the Pages one. That fails with:
#
#   ✘ Missing entry-point to Worker script or to assets directory
#
# and the deployment never happens, so the site silently stays on the
# previous version. That is exactly what happened here.
#
# So the file lives under a name Cloudflare doesn't look for, the
# production D1 binding is set in the dashboard instead (see SETUP.md),
# and Pages keeps using the plain Git build that has always worked.
#
# TO USE IT LOCALLY:
#
#   cp wrangler.example.toml wrangler.toml     # git ignores it
#   npx wrangler pages dev
#
# ============================================================
#
# The site works without any of this. Every dynamic feature
# checks whether its binding exists and falls back to the static
# behaviour if it doesn't, so deploying this file changes nothing
# until the database below is actually created.
#
# ONE-TIME SETUP (about three minutes, needs your Cloudflare
# account, which is why it can't be done for you):
#
#   see SETUP.md — the production binding is a dashboard setting
# ============================================================

name = "reiad-website"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "aab"

# ---------- D1: the database everything dynamic runs on ----------
# Articles, reader questions, subscribers, enquiries, view counts and
# admin sessions all live here. One database, comfortably inside the
# free tier for a long time.
#
# ---- THIS IS THE BINDING. There is nothing to click. ----
#
# Declaring the database here is all Cloudflare Pages needs: it reads
# this file on every deploy and attaches the binding itself. The
# dashboard's Settings → Bindings screen does the same job by hand, so
# if this file is right, you never have to go near it.
#
# To switch the dynamic half on:
#   1. Cloudflare dashboard → Storage & Databases → D1 → your database
#   2. Copy the "Database ID" (a UUID like 1a2b3c4d-...). It is not a
#      secret — it identifies a database, it does not open one.
#   3. Uncomment the four lines below and paste it in.
#   4. Commit. The next deploy has a database.
#
# The tables create themselves on the first request that needs them
# (see functions/_lib/db.js), so there is no schema step and no way to
# end up half-migrated.
#
[[d1_databases]]
binding = "DB"
database_name = "reiad"
database_id = "ad23dea3-74fc-4346-8119-ab5936f1a708"

# ---------- Workers AI (optional) ----------
# functions/api/news.js uses an `AI` binding to translate headlines
# into Bangla, and skips the translation when it isn't there.
#
# It is deliberately NOT declared here: an [ai] binding forces
# `wrangler pages dev` into remote mode, which needs an API token,
# and that would break local development for the sake of one
# optional feature. Turn it on instead in the Cloudflare dashboard:
#   Workers & Pages → your project → Settings → Bindings →
#   Add → Workers AI → variable name: AI

[vars]
SITE_ORIGIN = "https://reiad.co.uk"
