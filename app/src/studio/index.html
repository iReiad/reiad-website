<!DOCTYPE html>
<!-- The Studio, in React.

     The shell is deliberately the same as every other page on this
     site: same head, same header markup, same stylesheet, same
     theme-before-paint script. Only what is inside #studio-root is
     React. TRANSITION.md Stage 9 asks for exactly that, because a
     port that also redesigns the page cannot be judged: if it
     looked different you would not know whether React or the
     rewrite did it.

     The old /studio.html stays at its URL until this one has done
     a real publish. Then it goes. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Article Studio · Reiad's Library</title>
  <meta name="description" content="Paste an article, clean it up, resize the photos and publish it.">
  <meta name="robots" content="noindex, nofollow">

  <!-- Theme before first paint: no white flash for dark-mode readers. -->
  <script>
    (function () {
      var d = document.documentElement;
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || t === "light") d.setAttribute("data-theme", t);
        var a = localStorage.getItem("audience");
        if (a === "learn" || a === "work") d.setAttribute("data-audience", a);
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Bengali:wght@400;500&family=Noto+Serif+Bengali:wght@500;600&display=swap"
        media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Bengali:wght@400;500&family=Noto+Serif+Bengali:wght@500;600&display=swap"></noscript>

  <!-- The design system, unchanged. React renders the same class
       names into these same rules; there is no CSS in the bundle. -->
  <link rel="stylesheet" href="/styles.css">

  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0B3D2E">
</head>
<body>
  <a class="skip" href="#studio-root">Skip to the Studio</a>

  <header>
    <div class="wrap header-inner">
      <a class="site-name" href="/index.html">
        <svg class="site-mark" viewBox="0 0 100 100" fill="none" aria-hidden="true">
          <rect x="22" y="58" width="10" height="20" rx="3" fill="currentColor"/>
          <rect x="40" y="46" width="10" height="32" rx="3" fill="currentColor"/>
          <rect x="58" y="32" width="10" height="46" rx="3" fill="currentColor"/>
          <circle cx="63" cy="24" r="5.5" fill="currentColor"/>
        </svg>
        Reiad's Library
      </a>
      <nav aria-label="Main">
        <a href="/learn/index.html" data-keep>Learn</a>
        <a href="/skills/index.html" data-nav-skills>Skills</a>
        <a href="/tools/index.html">Tools</a>
        <a href="/insights.html">Insights</a>
        <a href="/portfolio.html">Portfolio</a>
        <a href="/about.html">About</a>
        <a href="/contact.html" data-keep>Contact</a>
      </nav>
      <button class="icon-btn" id="open-menu" aria-label="Open the menu"><span class="burger" aria-hidden="true"></span>Menu</button>
      <button class="icon-btn" id="open-palette" aria-label="Search the site (Ctrl+K)">⌕ <span class="kbd-hint">Ctrl K</span></button>
      <button class="icon-btn" id="theme-toggle" aria-label="Switch between light and dark mode">◐</button>
    </div>
  </header>

  <main id="main">
    <!-- Hidden until auth.js says who is asking, exactly as the old
         Studio is. -->
    <div class="wrap" id="studio-root" hidden></div>
  </main>

  <footer>
    <div class="wrap">
      <span class="mono">Reiad's Library &middot; Finance &amp; Bangladesh markets</span>
      <p>Studio is a private authoring tool: it runs entirely in your browser and
         is excluded from search engines.</p>
      <p class="footer-mail"><a href="mailto:i@reiad.co.uk">i@reiad.co.uk</a></p>
    </div>
  </footer>

  <!-- main.tsx imports the site's own /app.js for the header, menu,
       palette and theme, rather than listing it here: Vite would
       try to resolve a tag like that as something to bundle, and
       it is the site's file, not this app's. -->
  <script type="module" src="./main.tsx"></script>
</body>
</html>
