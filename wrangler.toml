# ============================================================
# wrangler.toml: this site is a Worker with static assets.
#
#   npx wrangler deploy        deploys the Worker and aab/ together
#   npx wrangler dev           the real runtime, locally
#
# From an empty account: `wrangler login`, `wrangler d1 create
# reiad`, copy the database_id it prints in below, deploy, then set
# the admin passphrase by visiting /studio once. The tables create
# themselves on the first request that needs them, see
# functions/_lib/db.ts, so there is no schema step.
# ============================================================

name = "reiad-website"
main = "worker.js"

# The account these resources live in. Not a secret: it is the
# identifier in every dashboard URL and authenticates nothing. It is
# written down because a token scoped to "D1 Edit and nothing else"
# may not answer wrangler's "which account is this", and the import
# workflow fails with "Failed to automatically retrieve account IDs".
account_id = "e9b49e82786518eac2e7addec016d028"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# ---------- the site itself ----------
# Everything in aab/ is uploaded and served by Cloudflare directly.
# The Worker only sees a request when one of the rules below says so,
# or when no file matches.
[assets]
directory = "./aab"

# `binding` is what makes env.ASSETS exist, which is how worker.js
# falls back to a static file when a handler declines a request.
binding = "ASSETS"

# aab/404.html, for anything that matches neither an asset nor a
# route. Pages inferred this from the file's presence; Workers wants
# it said out loud, which is the better of the two behaviours.
not_found_handling = "404-page"

# Assets win over the Worker by default, and every path below needs
# it the other way round. With not_found_handling set, an unmatched
# path the asset router answers gets 404.html and the Worker is never
# called, so anything a Worker renders MUST be listed: /media/*
# (photos are in R2), /_next/* (the Next Worker's own scripts), the
# hubs, the schools. /feed.xml and /sitemap.xml are listed because
# the Worker merges database rows into the generated file.
#
# NOTHING HERE MAY BE COVERED BY ANYTHING ELSE HERE. Wrangler refuses
# an overlapping list at parse time and the whole deploy stops with
# "Invalid routes in run_worker_first", which is the deploy failing
# rather than a warning. `check-routes.ts` runs the same overlap test.
#
# NO ENTRY HERE ENDS IN .html, and that is what makes the redirects
# work: a listed path never reaches the asset router, and
# `aab/_redirects` IS the asset router, so an old spelling has to be
# ABSENT from this list for its 301 to fire. `/about` is here and
# `/about.html` deliberately is not.
#
# A `*` matches what comes AFTER the slash, so a bare path and its
# own star are two rules and neither covers the other. That is what
# took /skills/courses off the site, and it is why the pairs below
# are written out.
run_worker_first = ["/api/*", "/insights/*", "/cooking/*", "/travel/*", "/media/*", "/_next/*",
  "/feed.xml", "/sitemap.xml",
  "/insights", "/cooking", "/travel",
  "/about", "/contact", "/account", "/skills",
  # The third-party course section, and the one prefix here still
  # answering `.html` addresses: its five shapes are duplicated in
  # `aab/src/courses.ts` and `check-courses.ts` holds the two to
  # each other. The star matches slashes too, so the programme
  # segment needed no extra line.
  "/skills/courses", "/skills/courses/*",
  "/tools", "/tools/stock", "/tools/live",
  "/tools/routine", "/tools/routine/*",
  "/tools/diet", "/tools/diet/*",
  "/tools/research", "/tools/research/*",
  "/admin", "/work-alpha",
  "/portfolio", "/portfolio/*", "/",
  # "/desk" is deliberately NOT here: it is a 301 to /admin in
  # aab/_redirects, and a path this list claims never reaches
  # that file.
  "/studio",
  # The four schools. The star is deliberately wide rather than
  # "/money/*/*": naming seventeen stage slugs here would be data in
  # a config nothing checks, and a stage added in the Studio would
  # 404 until somebody remembered to come here. The cost is one
  # binding hop on the twenty-five school modules, which worker.js
  # answers by falling straight through to the file.
  "/money", "/deutsch", "/quran", "/english",
  "/money/*", "/deutsch/*", "/quran/*", "/english/*"]

# ---------- D1: the database everything dynamic runs on ----------
# Articles, reader questions, subscribers, enquiries, view counts and
# admin sessions. The ID identifies a database, it does not open one.
# Every dynamic feature checks for the binding and falls back to the
# static behaviour without it.
[[d1_databases]]
binding = "DB"
database_name = "reiad"
database_id = "ad23dea3-74fc-4346-8119-ab5936f1a708"

# ---------- R2: the photo store ----------
# An article body carries a `/media/...` path; the photo is here. The
# bucket has to exist before the first deploy or wrangler stops:
#
#   npx wrangler r2 bucket create reiad-media
#
# (./setup.sh does this.) Without the binding, /api/media answers
# "not configured" and the Studio embeds photos in the page instead.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "reiad-media"

# ---------- Notion (optional) ----------
# Set NOTION_TOKEN and the Studio grows an "Import from Notion"
# button: write in Notion, pull the page in, publish from here.
# It is a secret, so it is not in this file:
#
#   npx wrangler secret put NOTION_TOKEN
#
# Create the integration at notion.so/my-integrations, then open the
# page or database you write in and Connections → add it. Without
# the secret, /api/notion answers "not configured" and the button
# never appears.

# ---------- the schedules ----------
# Notion auto-sync every quarter hour, and fifteen minutes is a floor:
# Notion rate-limits at roughly three requests a second and a sync
# costs several per article. Then the nightly snapshot into R2 under
# backups/, which is the private half of the backup (the public half
# is .github/workflows/backup.yml).
#
# worker.js tells the jobs apart by matching event.cron against these
# EXACT strings: changing one here without changing it there stops
# that job running rather than running the wrong one.
[triggers]
crons = ["*/15 * * * *", "17 3 * * *", "0 6 * * 1"]

# ---------- Workers AI (optional) ----------
# functions/api/news.ts uses an `AI` binding to translate headlines
# into Bangla and skips the translation without it. Deliberately NOT
# declared here: an [ai] binding forces `wrangler dev` into remote
# mode, which needs an API token. Turn it on in the dashboard:
#   Workers & Pages → your Worker → Settings → Bindings →
#   Add → Workers AI → variable name: AI

[vars]
SITE_ORIGIN = "https://reiad.co.uk"

# Where reader accounts live, so the Worker can fetch the public keys
# it verifies an access token against (functions/_lib/reader.ts). A
# URL, not a secret: it is already in aab/account.js. The thing that
# must never appear here is the service role key, and it is nowhere
# in this repository.
#
# An older Supabase project signing HS256 rather than ES256 needs the
# project's JWT secret to verify. This one does not; if that changes:
#   npx wrangler secret put SUPABASE_JWT_SECRET
# Without it an HS256 token is refused rather than believed.
SUPABASE_URL = "https://wvjarqnnmkkuxyrndtya.supabase.co"

# The publishable key: this exact string is in aab/account.js, which
# every browser downloads. /api/broker reads and writes a reader's
# broker_tokens row AS THE READER, forwarding their own bearer, and
# PostgREST wants the apikey header beside it. Row-level security
# does the scoping either way.
SUPABASE_KEY = "sb_publishable_lvckv69CrjRyF1_urwDrCQ_PWoTH3UW"

# Who the dashboard treats as an admin: a comma-separated list of
# Supabase user ids. A user id names an account and opens nothing.
# The durable record is public.admins (see
# supabase/migrations/20260818030907_broker_admins.sql); this list is
# the half that works before that migration has run, and the two are
# OR'd together in functions/_lib/broker.ts.
ADMIN_READERS = "f8278696-caa3-4321-938c-ead22d86d144"

# ---------- the live portfolio (optional) ----------
# Two secrets, both optional, and the dashboard degrades politely
# without either:
#
#   npx wrangler secret put BROKER_TOKEN_KEY
#     Any long random string. It seals every stored Trading 212
#     key with AES-GCM before the row is written; without it,
#     nothing is ever stored and readers can still paste a key
#     that lives only for the session.
#
#   npx wrangler secret put T212_PUBLIC_TOKEN
#     The site's own Trading 212 API key, read-scoped, behind the
#     public percentages on /tools/live. An admin can instead
#     set (and rotate) the same thing from the dashboard itself,
#     sealed into D1 settings; this secret wins where both exist.

[[services]]
binding = "NEXT"
service = "reiad-next"
