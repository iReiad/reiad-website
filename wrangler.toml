# ============================================================
# wrangler.toml, Cloudflare Workers configuration.
#
# This site is a Worker with static assets. It used to be written
# as a Pages project, and for a while it was deployed as neither:
# the live Worker was built from a `worker.js` that only ever
# existed on somebody's laptop, so CI could not reproduce it and
# every automatic build failed. `worker.js` is in the repository
# now, and so is the configuration below that goes with it.
#
#   npx wrangler deploy        deploys the Worker and aab/ together
#   npx wrangler dev           the real runtime, locally
#
# ONE-TIME SETUP, if you are starting from an empty account:
#
#   npx wrangler login
#   npx wrangler d1 create reiad
#     → copy the database_id it prints into this file
#   npx wrangler deploy
#
# Then set the admin passphrase by visiting /studio.html once.
# The tables create themselves on the first request that needs
# them (see functions/_lib/db.js), so there is no schema step.
# ============================================================

name = "reiad-website"
main = "worker.js"

# The account these resources live in.
#
# Not a secret and not a credential: it is the identifier in every
# dashboard URL, it authenticates nothing on its own, and the
# `database_id` below is the same class of thing and has been
# committed since the database was made. It is here because
# wrangler otherwise has to ASK which account it is in, and an API
# token scoped to "D1 Edit and nothing else" is not allowed to
# answer that. The import workflow failed on exactly that:
#
#   Failed to automatically retrieve account IDs for the logged in user
#
# The alternative was a second repository secret, which would have
# meant the workflow needed two things set up instead of one, and
# the note at the top of import-schools.yml promises one.
account_id = "e9b49e82786518eac2e7addec016d028"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# ---------- the site itself ----------
# Everything in aab/ is uploaded and served by Cloudflare directly.
# The Worker only sees a request when one of the rules below says so,
# or when no file matches.
[assets]
directory = "./aab"

# `binding` is what makes env.ASSETS exist, which is how worker.js
# falls back to a static file when a handler declines a request.
binding = "ASSETS"

# aab/404.html, for anything that matches neither an asset nor a
# route. Pages inferred this from the file's presence; Workers wants
# it said out loud, which is the better of the two behaviours.
not_found_handling = "404-page"

# Assets win over the Worker by default, and for these two prefixes
# that is the wrong way round:
#
#   /api/*       nothing in aab/ answers these, so this changes no
#                behaviour, it is here so the intent is on the page.
#   /insights/*  every piece is a row and the three mounts are
#   /cooking/*   rendered by the Next.js Worker as of Stage 11.2.
#   /travel/*    These were listed before that for the older reason,
#                which was that serving a committed file first meant
#                an article published to D1 under the same slug never
#                got a look in. Both reasons want the same line.
#   /media/*     photos live in R2, and nothing in aab/ matches. That
#                is precisely the problem: with not_found_handling
#                set, the asset router answers an unmatched path with
#                404.html and the Worker is never called, so every
#                published photo 404s. It has to be listed.
#   /feed.xml    both are generated from content.js, which cannot see
#   /sitemap.xml an article published to the database. The Worker
#                serves the generated file with those merged in, so a
#                piece published from the Studio is actually
#                findable. Assets would otherwise win and the merge
#                would never run.
#   the three    /insights.html, /cooking/index.html and
#   hubs         /travel/index.html are rendered by the Next.js
#                Worker as of Stage 11.1. They have to be listed
#                for two reasons rather than one: the files are
#                still there for now and would win, and the asset
#                router redirects a .html address to its pretty
#                form before the Worker is ever called, so the
#                canonical URL would 308 rather than render.
#   /_next/*     the Next.js Worker's own JavaScript, once the NEXT
#                service binding exists. Nothing in aab/ matches, so
#                with not_found_handling set the asset router would
#                answer every one of them with 404.html and the
#                Worker would never be called: an article rendered
#                by Next asked for six scripts and got six copies of
#                the 404 page. Listing it costs nothing while the
#                binding is absent, because worker.js then falls
#                through to the assets exactly as before.
run_worker_first = ["/api/*", "/insights/*", "/cooking/*", "/travel/*", "/media/*", "/_next/*",
  "/feed.xml", "/sitemap.xml", "/insights.html", "/cooking/index.html", "/travel/index.html",
  "/about.html", "/contact.html"]

# ---------- D1: the database everything dynamic runs on ----------
# Articles, reader questions, subscribers, enquiries, view counts and
# admin sessions all live here. One database, comfortably inside the
# free tier for a long time.
#
# The ID is not a secret: it identifies a database, it does not open
# one. Deploying with it absent is safe: every dynamic feature checks
# for the binding and falls back to the static behaviour without it.
[[d1_databases]]
binding = "DB"
database_name = "reiad"
database_id = "ad23dea3-74fc-4346-8119-ab5936f1a708"

# ---------- R2: the photo store ----------
# Article photos used to be base64 data URLs inside the article body.
# That put a third more bytes than the photo into a D1 column capped
# at 2 MB, and the body was being truncated to fit. Photos live here
# now and the body carries a `/media/...` path.
#
# The bucket has to exist before the first deploy, or wrangler stops:
#
#   npx wrangler r2 bucket create reiad-media
#
# (./setup.sh does this for you.) Without the binding, /api/media
# answers "not configured" and the Studio goes back to embedding
# photos in the page, exactly as it did before.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "reiad-media"

# ---------- Notion (optional) ----------
# Set NOTION_TOKEN and the Studio grows an "Import from Notion"
# button: write in Notion, pull the page in, publish from here.
# It is a secret, so it is not in this file:
#
#   npx wrangler secret put NOTION_TOKEN
#
# Create the integration at notion.so/my-integrations, then open the
# page or database you write in and Connections → add it. Without
# the secret, /api/notion answers "not configured" and the button
# never appears.

# ---------- Notion auto-sync ----------
# Every quarter hour, any article that came from Notion is checked
# against its page and pulled in again if it changed. Nothing happens
# without NOTION_TOKEN, and nothing happens to a page whose Status
# column says it isn't ready, see functions/_lib/sync.js.
#
# Cron triggers are free and are not billed as requests. Fifteen
# minutes is a deliberate floor: Notion rate-limits at roughly three
# requests a second, and a sync costs several per article.
#
# ---------- the nightly backup ----------
# The second schedule writes a snapshot of every table worth keeping
# into R2, under backups/. It is the private half of the backup; the
# public half is live articles committed to this repository nightly
# by .github/workflows/backup.yml. The split is about who can read
# the result, and the reasoning is in functions/_lib/backup.js.
#
# worker.js tells the two apart by matching event.cron against these
# exact strings, so changing one here without changing it there
# stops that job running rather than running the wrong one.
[triggers]
crons = ["*/15 * * * *", "17 3 * * *"]

# ---------- Workers AI (optional) ----------
# functions/api/news.js uses an `AI` binding to translate headlines
# into Bangla, and skips the translation when it isn't there.
#
# It is deliberately NOT declared here: an [ai] binding forces
# `wrangler dev` into remote mode, which needs an API token, and that
# would break local development for the sake of one optional feature.
# Turn it on instead in the Cloudflare dashboard:
#   Workers & Pages → your Worker → Settings → Bindings →
#   Add → Workers AI → variable name: AI

[vars]
SITE_ORIGIN = "https://reiad.co.uk"

# Where reader accounts live. The Worker needs it to fetch the public
# keys it verifies a reader's access token against, see
# functions/_lib/reader.js.
#
# This is a URL, not a secret: it is already in aab/account.js, which
# every browser downloads. The thing that must never appear here is
# the service role key, and it does not exist anywhere in this
# repository.
#
# Older Supabase projects sign tokens with HS256 rather than ES256,
# and those need the project's JWT secret to verify. This one does
# not, and if that ever changes the secret goes in as a secret:
#   npx wrangler secret put SUPABASE_JWT_SECRET
# Without it, an HS256 token is refused rather than believed.
SUPABASE_URL = "https://wvjarqnnmkkuxyrndtya.supabase.co"

[[services]]
binding = "NEXT"
service = "reiad-next"
